
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>神舞 -Kamui- ECサイト</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Yuji Syuku', serif;
      background: url('bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #ffe4b5;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .hero-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 64px;
      font-weight: bold;
      color: gold;
      text-shadow: 3px 3px 6px #000;
      line-height: 1.2em;
      overflow: hidden;
    }

    .hero-text span {
      display: inline-block;
      opacity: 0;
      animation: drawText 1.8s ease forwards;
      transform-origin: center;
    }

    .hero-text span:nth-child(1) { animation-delay: 0s; }
    .hero-text span:nth-child(2) { animation-delay: 0.2s; }
    .hero-text span:nth-child(3) { animation-delay: 0.4s; }
    .hero-text span:nth-child(4) { animation-delay: 0.6s; }
    .hero-text span:nth-child(5) { animation-delay: 0.8s; }
    .hero-text span:nth-child(6) { animation-delay: 1s; }
    .hero-text span:nth-child(7) { animation-delay: 1.2s; }
    .hero-text span:nth-child(8) { animation-delay: 1.4s; }
    .hero-text span:nth-child(9) { animation-delay: 1.6s; }
    .hero-text span:nth-child(10) { animation-delay: 1.8s; }
    .hero-text span:nth-child(11) { animation-delay: 2s; }

    @keyframes drawText {
      0% { opacity: 0; transform: scale(0.5) rotate(15deg); }
      50% { opacity: 1; transform: scale(1.05) rotate(0deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    header {
      background-color: rgba(0, 0, 0, 0.85);
      text-align: center;
      padding: 15px;
    }
    .logo {
      height: 100px;
    }
    nav ul {
      display: flex;
      justify-content: center;
      list-style: none;
      gap: 30px;
      padding: 10px;
    }
    nav ul li a {
      color: gold;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
    }
    footer {
      background-color: rgba(0,0,0,0.7);
      color: #ccc;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" class="logo" alt="神舞ロゴ">
    <nav>
      <ul>
        <li><a href="index.html">ホーム</a></li>
        <li><a href="product.html">商品</a></li>
        <li><a href="cart.html">カート</a></li>
        <li><a href="contact.html">お問い合わせ</a></li>
      </ul>
    </nav>
  </header>

  <div class="hero-text">
    <span>昇</span>
    <span>り</span>
    <span>龍</span>
    <span>の</span>
    <span>如</span>
    <span>く</span>
    <span>釣</span>
    <span>り</span>
    <span>の</span>
    <span>極</span>
    <span>み</span>
    <span>へ</span>
  </div>

  <footer>
    <p>お問い合わせ：090-1843-3099<br>
    Instagram: <a href="https://www.instagram.com/kamui_official_2023" target="_blank" style="color: #ffd700;">@kamui_official_2023</a></p>
    <p>&copy; 2025 神舞 -Kamui-</p>
  </footer>
</body>
</html>
